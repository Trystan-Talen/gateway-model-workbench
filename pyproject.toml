[project]
name = "gateway-model-workbench"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["httpx[http2]==0.28.1", "keyring==25.6.0"]

[project.optional-dependencies]
dev = ["coverage==7.10.7"]

[tool.coverage.run]
source = ["task_status", "preflight", "quality_report", "routing_compare"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.setuptools.dynamic]
version = {attr = "app_version.APP_VERSION"}
